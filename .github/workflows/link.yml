name: Upload URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the file to download"
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Install dependencies
      # ==========================================

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib

          echo "Dependencies installed."


      # ==========================================
      # Create Google Drive token
      # ==========================================

      - name: Create Google Drive token
        env:
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}

        run: |
          set -e

          if [ -z "$GOOGLE_DRIVE_TOKEN" ]; then
            echo "ERROR: GOOGLE_DRIVE_TOKEN secret is not configured."
            exit 1
          fi

          umask 077

          printf '%s' "$GOOGLE_DRIVE_TOKEN" > token.json

          echo "Google Drive token created."


      # ==========================================
      # Download URL
      # ==========================================

      - name: Download URL
        env:
          INPUT_URL: ${{ inputs.url }}

        run: |
          set -euo pipefail

          URL="$INPUT_URL"

          echo "======================================"
          echo "Downloading URL"
          echo "======================================"

          echo "$URL"

          if [ -z "$URL" ]; then
            echo "ERROR: URL is empty."
            exit 1
          fi


          mkdir -p downloads


          # ======================================
          # Determine filename
          # ======================================

          FILENAME=$(basename \
            "$(echo "$URL" | sed 's/[?#].*//')"
          )


          if [ -z "$FILENAME" ] || [ "$FILENAME" = "/" ]; then
            FILENAME="download"
          fi


          echo ""
          echo "Filename:"
          echo "$FILENAME"


          # ======================================
          # Download
          # ======================================

          cd downloads


          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 1800 \
            -OJ \
            "$URL" || \
          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 1800 \
            -o "$FILENAME" \
            "$URL"


          # ======================================
          # Find downloaded file
          # ======================================

          FILE="$(find "$PWD" -maxdepth 1 -type f -printf '%T@ %p\n' \
            | sort -nr \
            | head -n1 \
            | cut -d' ' -f2-)"


          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "ERROR: Downloaded file was not found."
            exit 1
          fi


          echo ""
          echo "======================================"
          echo "Download completed"
          echo "======================================"

          echo "File:"
          echo "$FILE"

          echo ""
          echo "Size:"
          du -h "$FILE"

          cd ..


          # ======================================
          # Export for next step
          # ======================================

          echo "FILE=$FILE" >> "$GITHUB_ENV"


      # ==========================================
      # Upload to Google Drive
      # ==========================================

      - name: Upload to Google Drive
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Uploading to Google Drive"
          echo "======================================"

          echo "File:"
          echo "$FILE"


          export FILE


          python3 <<'PY'

          import json
          import mimetypes
          import os

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from google.oauth2 import service_account

          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          # ==========================================
          # File
          # ==========================================

          file_path = os.environ["FILE"]

          file_name = os.path.basename(file_path)

          mime_type = (
              mimetypes.guess_type(file_name)[0]
              or "application/octet-stream"
          )


          print("File name:")
          print(file_name)

          print("MIME type:")
          print(mime_type)


          # ==========================================
          # Read Google token
          # ==========================================

          with open(
              "token.json",
              "r",
              encoding="utf-8"
          ) as f:

              token_info = json.load(f)


          scopes = [
              "https://www.googleapis.com/auth/drive"
          ]


          # ==========================================
          # Authentication
          # ==========================================

          if token_info.get("type") == "service_account":

              print(
                  "Authentication: Service Account"
              )

              creds = (
                  service_account
                  .Credentials
                  .from_service_account_info(
                      token_info,
                      scopes=scopes
                  )
              )

          else:

              print(
                  "Authentication: OAuth"
              )

              creds = (
                  Credentials
                  .from_authorized_user_info(
                      token_info,
                      scopes=scopes
                  )
              )

              if (
                  creds.expired
                  and creds.refresh_token
              ):

                  print(
                      "Refreshing OAuth token..."
                  )

                  creds.refresh(
                      Request()
                  )


          # ==========================================
          # Google Drive API
          # ==========================================

          service = build(
              "drive",
              "v3",
              credentials=creds
          )


          # ==========================================
          # Upload
          # ==========================================

          media = MediaFileUpload(
              file_path,
              mimetype=mime_type,
              resumable=True
          )


          uploaded = (
              service.files()
              .create(
                  body={
                      "name": file_name
                  },
                  media_body=media,
                  fields="id,name,webViewLink"
              )
              .execute()
          )


          # ==========================================
          # Result
          # ==========================================

          print("")
          print("======================================")
          print("UPLOAD SUCCESS")
          print("======================================")

          print(
              json.dumps(
                  uploaded,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print("======================================")


          PY


      # ==========================================
      # Cleanup
      # ==========================================

      - name: Cleanup
        if: always()
        run: |
          rm -f token.json
          rm -rf downloads

          echo "Cleanup completed."
    
    