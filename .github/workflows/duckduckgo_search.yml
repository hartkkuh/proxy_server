name: DuckDuckGo search

on:
  repository_dispatch:
    types: [duckduckgo_search]

jobs:
  duckduckgo_search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install search dependencies
        run: python3 -m pip install -U ddgs

      - name: Search DuckDuckGo and save HTML
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          QUESTION=$(echo "$PAYLOAD" | jq -r '.question // empty')
          TYPE=$(echo "$PAYLOAD" | jq -r '.type // empty')

          if [ -z "$QUESTION" ]; then
            echo "Missing question"
            exit 1
          fi
          if [ -z "$TYPE" ]; then
            echo "Missing type"
            exit 1
          fi

          mkdir -p output
          OUT="output/duckduckgo-${TYPE}.html"

          echo "Question: $QUESTION"
          echo "Type: $TYPE"

          python3 .github/scripts/duckduckgo_search.py "$QUESTION" "$TYPE" "$OUT"

          echo "Saved: $OUT ($(wc -c < "$OUT") bytes)"

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckduckgo-search
          path: output/
          if-no-files-found: error
