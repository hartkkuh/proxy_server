name: DuckDuckGo search

on:
  repository_dispatch:
    types: [duckduckgo_search]

jobs:
  duckduckgo_search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search DuckDuckGo and save HTML
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          QUESTION=$(echo "$PAYLOAD" | jq -r '.question // empty')
          TYPE=$(echo "$PAYLOAD" | jq -r '.type // empty')

          if [ -z "$QUESTION" ]; then
            echo "Missing question"
            exit 1
          fi
          if [ -z "$TYPE" ]; then
            echo "Missing type"
            exit 1
          fi

          export QUESTION
          ENCODED=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['QUESTION']))")

          case "$TYPE" in
            web)
              URL="https://html.duckduckgo.com/html/?q=${ENCODED}"
              ;;
            images)
              URL="https://html.duckduckgo.com/html/?q=${ENCODED}&iax=images&ia=images"
              ;;
            videos)
              URL="https://html.duckduckgo.com/html/?q=${ENCODED}&iax=videos&ia=videos"
              ;;
            news)
              URL="https://html.duckduckgo.com/html/?q=${ENCODED}&iar=news&ia=news"
              ;;
            *)
              echo "Invalid type: $TYPE"
              exit 1
              ;;
          esac

          mkdir -p output
          RAW="output/raw-${TYPE}.html"
          OUT="output/duckduckgo-${TYPE}.html"

          echo "Question: $QUESTION"
          echo "Type: $TYPE"
          echo "Fetching: $URL"

          curl -fsSL \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml" \
            -o "$RAW" \
            "$URL"

          python3 .github/scripts/normalize_duckduckgo_html.py "$RAW" "$OUT"
          rm -f "$RAW"

          echo "Saved: $OUT ($(wc -c < "$OUT") bytes)"

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckduckgo-search
          path: output/
          if-no-files-found: error
