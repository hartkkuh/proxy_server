name: Chrome GUI Remote

on:
  workflow_dispatch:

jobs:
  chrome:
    runs-on: ubuntu-latest

    steps:
      - name: Install Chrome, VNC and noVNC
        run: |
          sudo apt update
          sudo apt install -y \
            chromium-browser \
            xvfb \
            x11vnc \
            novnc \
            websockify

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1024x576x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 3

      - name: Start VNC server
        run: |
          x11vnc \
            -display :99 \
            -nopw \
            -forever \
            -shared \
            -rfbport 5900 &

          sleep 3

      - name: Start noVNC
        run: |
          websockify \
            --web=/usr/share/novnc/ \
            6080 \
            localhost:5900 &

          sleep 5

      - name: Install Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start tunnel
        run: |
          cloudflared tunnel --url http://localhost:6080 > tunnel.log 2>&1 &

          sleep 10

          echo "===== Tunnel URL ====="
          grep -o "https://[-a-zA-Z0-9.]*trycloudflare.com" tunnel.log || true

      - name: Open Chrome
        run: |
          chromium-browser \
            --no-sandbox \
            --disable-dev-shm-usage \
            --start-maximized &

      - name: Keep session alive
        run: |
          echo "Chrome is running"
          sleep 21600