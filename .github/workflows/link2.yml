name: Upload GoFile URL to Google Drive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "GoFile URL"
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib

      # ============================================================
      # 4. Prepare folders
      # ============================================================
      - name: Prepare downloads directory
        run: |
          rm -rf downloads
          mkdir -p downloads

      # ============================================================
      # 5. Download from GoFile
      #
      # Uses the current GoFile downloader implementation.
      #
      # This handles:
      # - Guest accounts
      # - Dynamic X-Website-Token
      # - error-notPremium fallback
      # - folders
      # - nested folders
      # - multiple files
      # - special characters
      # ============================================================
      - name: Download from GoFile
        env:
          GOFILE_URL: ${{ inputs.url }}
        run: |
          set -e

          echo "=========================================="
          echo "GoFile download"
          echo "=========================================="
          echo "URL: $GOFILE_URL"
          echo

          git clone --depth 1 \
            https://github.com/martadams89/gofile-dl.git \
            gofile-dl

          cd gofile-dl

          echo
          echo "Installing GoFile downloader dependencies..."
          pip install -r requirements.txt

          echo
          echo "Starting GoFile download..."
          echo

          python run.py \
            "$GOFILE_URL" \
            -d ../downloads \
            -t 4

          cd ..

          echo
          echo "=========================================="
          echo "Downloaded files:"
          echo "=========================================="

          find downloads -type f -printf '%p\n' || true

      # ============================================================
      # 6. Check downloaded files
      # ============================================================
      - name: Verify downloads
        run: |
          echo "Checking downloaded files..."

          FILE_COUNT=$(find downloads -type f | wc -l)

          echo "Files found: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No files were downloaded."
            exit 1
          fi

          echo
          echo "Downloaded files:"
          find downloads -type f -printf '%p\n'

      # ============================================================
      # 7. Create Google Drive token
      # ============================================================
      - name: Prepare Google Drive credentials
        env:
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
        run: |
          if [ -z "$GOOGLE_DRIVE_TOKEN" ]; then
            echo "ERROR: GOOGLE_DRIVE_TOKEN secret is missing."
            exit 1
          fi

          printf '%s' "$GOOGLE_DRIVE_TOKEN" > token.json

          echo "Google Drive credentials prepared."

      # ============================================================
      # 8. Upload everything to Google Drive
      # ============================================================
      - name: Upload to Google Drive
        env:
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
        run: |
          python <<'PY'
          import os
          import json
          import mimetypes
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          DOWNLOAD_DIR = Path("downloads")
          TOKEN_FILE = Path("token.json")

          SCOPES = [
              "https://www.googleapis.com/auth/drive"
          ]


          print("==========================================")
          print("Google Drive upload")
          print("==========================================")


          # ----------------------------------------------------------
          # Load OAuth token
          # ----------------------------------------------------------

          if not TOKEN_FILE.exists():
              raise RuntimeError("token.json was not created.")


          creds = Credentials.from_authorized_user_file(
              str(TOKEN_FILE),
              SCOPES
          )


          # ----------------------------------------------------------
          # Refresh token if necessary
          # ----------------------------------------------------------

          if creds.expired and creds.refresh_token:
              print("Refreshing Google Drive token...")
              creds.refresh(Request())


          # ----------------------------------------------------------
          # Connect to Google Drive
          # ----------------------------------------------------------

          service = build(
              "drive",
              "v3",
              credentials=creds
          )


          # ----------------------------------------------------------
          # Optional:
          # Upload into a folder if DRIVE_FOLDER_ID is configured.
          #
          # If DRIVE_FOLDER_ID is not configured, files go to
          # the root of Google Drive.
          # ----------------------------------------------------------

          parent_id = os.environ.get("DRIVE_FOLDER_ID", "").strip()


          # ----------------------------------------------------------
          # Find files
          # ----------------------------------------------------------

          files = [
              p
              for p in DOWNLOAD_DIR.rglob("*")
              if p.is_file()
          ]


          if not files:
              raise RuntimeError("No downloaded files found.")


          print(f"Files to upload: {len(files)}")
          print()


          # ----------------------------------------------------------
          # Upload each file
          # ----------------------------------------------------------

          for index, path in enumerate(files, start=1):

              print("------------------------------------------")
              print(f"[{index}/{len(files)}] Uploading:")
              print(path)


              mime_type, _ = mimetypes.guess_type(str(path))

              if mime_type is None:
                  mime_type = "application/octet-stream"


              metadata = {
                  "name": path.name
              }


              if parent_id:
                  metadata["parents"] = [parent_id]


              media = MediaFileUpload(
                  str(path),
                  mimetype=mime_type,
                  resumable=True
              )


              uploaded = service.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,size,webViewLink"
              ).execute()


              print()
              print("Upload successful!")
              print(f"Name: {uploaded.get('name')}")
              print(f"ID: {uploaded.get('id')}")
              print(f"Size: {uploaded.get('size')}")
              print(f"Link: {uploaded.get('webViewLink')}")
              print()


          print("==========================================")
          print("ALL FILES UPLOADED SUCCESSFULLY")
          print("==========================================")
          PY

      # ============================================================
      # 9. Cleanup
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          rm -rf downloads
          rm -rf gofile-dl
          rm -f token.json

          echo "Cleanup completed."