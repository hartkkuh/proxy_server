name: Upload terabox URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the file to download"
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Install dependencies
      # ==========================================

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib

          echo "Dependencies installed."


      # ==========================================
      # Create Google Drive token
      # ==========================================

      - name: Create Google Drive token
        env:
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}

        run: |
          set -e

          if [ -z "$GOOGLE_DRIVE_TOKEN" ]; then
            echo "ERROR: GOOGLE_DRIVE_TOKEN secret is not configured."
            exit 1
          fi

          umask 077

          printf '%s' "$GOOGLE_DRIVE_TOKEN" > token.json

          echo "Google Drive token created."


      # ==========================================
      # Resolve Terabox URL using external API
      # ==========================================

      - name: Resolve and Download Terabox
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail

          URL="$INPUT_URL"

          echo "======================================"
          echo "Terabox Resolver"
          echo "======================================"

          if [ -z "$URL" ]; then
            echo "ERROR: URL is empty."
            exit 1
          fi

          mkdir -p downloads

          # ======================================
          # Call external Terabox API
          # ======================================

          API_URL="https://terabox-worker.robinkumarshakya103.workers.dev/api"

          echo ""
          echo "Resolving:"
          echo "$URL"

          RESPONSE=$(curl \
            --fail \
            --show-error \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            --get \
            --data-urlencode "url=$URL" \
            "$API_URL")

          echo ""
          echo "API response received."

          # ======================================
          # Validate response
          # ======================================

          echo "$RESPONSE" | python3 -m json.tool > /tmp/terabox_response.json

          SUCCESS=$(python3 - <<'PY'
          import json

          with open("/tmp/terabox_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(str(data.get("success", False)).lower())
          PY
          )

          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "ERROR: Terabox API failed."

            cat /tmp/terabox_response.json

            exit 1
          fi

          # ======================================
          # Extract first file
          # ======================================

          FILENAME=$(python3 - <<'PY'
          import json

          with open("/tmp/terabox_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          files = data.get("files", [])

          if not files:
              raise SystemExit("No files returned by Terabox API.")

          file = files[0]

          name = (
              file.get("file_name")
              or file.get("filename")
              or "download"
          )

          print(name)
          PY
          )

          DOWNLOAD_URL=$(python3 - <<'PY'
          import json

          with open("/tmp/terabox_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          files = data.get("files", [])

          if not files:
              raise SystemExit("No files returned by Terabox API.")

          file = files[0]

          url = (
              file.get("download_url")
              or file.get("direct_link")
              or file.get("dlink")
          )

          if not url:
              raise SystemExit(
                  "Terabox API did not return a download URL."
              )

          print(url)
          PY
          )

          echo ""
          echo "Filename:"
          echo "$FILENAME"

          echo ""
          echo "Direct download URL obtained."

          # ======================================
          # Download
          # ======================================

          OUTPUT="downloads/$FILENAME"

          echo ""
          echo "Downloading..."

          curl \
            --location \
            --fail \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 60 \
            --max-time 7200 \
            --continue-at - \
            --user-agent "Mozilla/5.0" \
            --output "$OUTPUT" \
            "$DOWNLOAD_URL"

          # ======================================
          # Verify
          # ======================================

          if [ ! -f "$OUTPUT" ]; then
            echo ""
            echo "ERROR: File was not downloaded."
            exit 1
          fi

          ACTUAL_SIZE=$(stat -c%s "$OUTPUT")

          echo ""
          echo "======================================"
          echo "Download completed"
          echo "======================================"

          echo "File:"
          echo "$OUTPUT"

          echo ""
          echo "Size:"
          du -h "$OUTPUT"

          echo ""
          echo "Bytes:"
          echo "$ACTUAL_SIZE"

          # ======================================
          # Export
          # ======================================

          echo "FILE=$OUTPUT" >> "$GITHUB_ENV"

          rm -f /tmp/terabox_response.json
    
      # ==========================================
      # Upload to Google Drive
      # ==========================================

      - name: Upload to Google Drive
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Uploading to Google Drive"
          echo "======================================"

          echo "File:"
          echo "$FILE"


          export FILE


          python3 <<'PY'

          import json
          import mimetypes
          import os

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from google.oauth2 import service_account

          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          # ==========================================
          # File
          # ==========================================

          file_path = os.environ["FILE"]

          file_name = os.path.basename(file_path)

          mime_type = (
              mimetypes.guess_type(file_name)[0]
              or "application/octet-stream"
          )


          print("File name:")
          print(file_name)

          print("MIME type:")
          print(mime_type)


          # ==========================================
          # Read Google token
          # ==========================================

          with open(
              "token.json",
              "r",
              encoding="utf-8"
          ) as f:

              token_info = json.load(f)


          scopes = [
              "https://www.googleapis.com/auth/drive"
          ]


          # ==========================================
          # Authentication
          # ==========================================

          if token_info.get("type") == "service_account":

              print(
                  "Authentication: Service Account"
              )

              creds = (
                  service_account
                  .Credentials
                  .from_service_account_info(
                      token_info,
                      scopes=scopes
                  )
              )

          else:

              print(
                  "Authentication: OAuth"
              )

              creds = (
                  Credentials
                  .from_authorized_user_info(
                      token_info,
                      scopes=scopes
                  )
              )

              if (
                  creds.expired
                  and creds.refresh_token
              ):

                  print(
                      "Refreshing OAuth token..."
                  )

                  creds.refresh(
                      Request()
                  )


          # ==========================================
          # Google Drive API
          # ==========================================

          service = build(
              "drive",
              "v3",
              credentials=creds
          )


          # ==========================================
          # Upload
          # ==========================================

          media = MediaFileUpload(
              file_path,
              mimetype=mime_type,
              resumable=True
          )


          uploaded = (
              service.files()
              .create(
                  body={
                      "name": file_name
                  },
                  media_body=media,
                  fields="id,name,webViewLink"
              )
              .execute()
          )


          # ==========================================
          # Result
          # ==========================================

          print("")
          print("======================================")
          print("UPLOAD SUCCESS")
          print("======================================")

          print(
              json.dumps(
                  uploaded,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print("======================================")


          PY


      # ==========================================
      # Cleanup
      # ==========================================

      - name: Cleanup
        if: always()
        run: |
          rm -f token.json
          rm -rf downloads

          echo "Cleanup completed."
    
    