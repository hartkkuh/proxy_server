name: Download YouTube

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "YouTube URLs - one URL per line"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

          python -m pip install -U \
            "yt-dlp[default]" \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib

      - name: Create Google Drive token
        env:
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
        run: |
          if [ -z "$GOOGLE_DRIVE_TOKEN" ]; then
            echo "ERROR: GOOGLE_DRIVE_TOKEN secret is not configured."
            exit 1
          fi

          umask 077
          printf '%s' "$GOOGLE_DRIVE_TOKEN" > token.json

      - name: Download and upload videos
        env:
          URLS: ${{ inputs.urls }}
        run: |
          set -e

          echo "======================================"
          echo "Starting YouTube download job"
          echo "======================================"

          COUNT=0

          while IFS= read -r URL; do

            # Skip empty lines
            if [ -z "$URL" ]; then
              continue
            fi

            COUNT=$((COUNT + 1))

            echo ""
            echo "======================================"
            echo "Processing URL #$COUNT"
            echo "$URL"
            echo "======================================"

            echo "Downloading..."

            FILE=$(yt-dlp \
              --cookies cookies.txt \
              --remote-components ejs:github \
              -f "best[height<=720]/best" \
              --merge-output-format mp4 \
              -o "%(title)s.%(ext)s" \
              --print after_move:filepath \
              "$URL")

            if [ -z "$FILE" ]; then
              echo "ERROR: yt-dlp did not return a file."
              exit 1
            fi

            echo ""
            echo "Downloaded:"
            echo "$FILE"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: File does not exist:"
              echo "$FILE"
              exit 1
            fi

            export FILE

            echo ""
            echo "Uploading to Google Drive..."

            python3 <<'PY'
          import json
          import os

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          file_path = os.environ["FILE"]
          file_name = os.path.basename(file_path)

          print(f"File: {file_name}")
          print(f"Path: {file_path}")

          with open("token.json", encoding="utf-8") as f:
              token_info = json.load(f)

          scopes = [
              "https://www.googleapis.com/auth/drive"
          ]

          # Service Account
          if token_info.get("type") == "service_account":

              print("Using Google Service Account")

              creds = service_account.Credentials.from_service_account_info(
                  token_info,
                  scopes=scopes
              )

          # OAuth token
          else:

              print("Using Google OAuth token")

              creds = Credentials.from_authorized_user_info(
                  token_info,
                  scopes=scopes
              )

              if creds.expired and creds.refresh_token:
                  print("Refreshing OAuth token...")
                  creds.refresh(Request())

          service = build(
              "drive",
              "v3",
              credentials=creds
          )

          media = MediaFileUpload(
              file_path,
              mimetype="video/mp4",
              resumable=True
          )

          uploaded = (
              service.files()
              .create(
                  body={
                      "name": file_name
                  },
                  media_body=media,
                  fields="id,name,webViewLink"
              )
              .execute()
          )

          print("")
          print("UPLOAD SUCCESS")
          print(json.dumps(
              uploaded,
              ensure_ascii=False,
              indent=2
          ))
          PY

            echo ""
            echo "Upload completed."

            # Delete local file to save runner disk space
            rm -f "$FILE"

            echo "Local file deleted."

          done <<< "$URLS"

          echo ""
          echo "======================================"
          echo "Finished"
          echo "Processed $COUNT URL(s)"
          echo "======================================"

      - name: Cleanup token
        if: always()
        run: |
          rm -f token.json