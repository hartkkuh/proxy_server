name: Download YouTube

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "YouTube URLs - one URL per line"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout repository
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Install dependencies
      # ==========================================

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          set -euxo pipefail

          echo "Checking installed tools..."

          echo "Python:"
          python --version

          echo "FFmpeg:"
          ffmpeg -version | head -n 1 || true

          echo "jq:"
          jq --version || true

          echo "Installing Deno..."

          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            https://deno.land/install.sh | sh

          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

          echo "Installing Python packages..."

          python -m pip install --upgrade pip

          python -m pip install --upgrade \
            "yt-dlp[default]" \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib

          echo "Installation completed."


      # ==========================================
      # Verify dependencies
      # ==========================================

      - name: Verify dependencies
        run: |
          set -e

          echo "======================================"
          echo "Dependency check"
          echo "======================================"

          python --version
          yt-dlp --version
          ffmpeg -version | head -n 1
          jq --version
          deno --version

          echo "======================================"
          echo "All dependencies OK"
          echo "======================================"


      # ==========================================
      # Create Google Drive token
      # ==========================================

      - name: Create Google Drive token
        env:
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}

        run: |
          set -e

          if [ -z "$GOOGLE_DRIVE_TOKEN" ]; then
            echo "ERROR:"
            echo "GOOGLE_DRIVE_TOKEN secret is not configured."
            exit 1
          fi

          echo "Creating token.json..."

          umask 077

          printf '%s' "$GOOGLE_DRIVE_TOKEN" > token.json

          echo "token.json created."


      # ==========================================
      # Download and upload
      # ==========================================

      - name: Download and upload videos
        env:
          URLS: ${{ inputs.urls }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Starting YouTube download job"
          echo "======================================"

          COUNT=0
          SUCCESS=0
          FAILED=0

          mkdir -p downloads


          # ==========================================
          # Read every URL
          # ==========================================

          while IFS= read -r URL || [ -n "$URL" ]; do

            # Remove CR from Windows-style input
            URL="${URL%$'\r'}"

            # Remove leading/trailing spaces
            URL="$(echo "$URL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            # Ignore empty lines
            if [ -z "$URL" ]; then
              continue
            fi

            COUNT=$((COUNT + 1))

            echo ""
            echo ""
            echo "======================================"
            echo "Processing URL #$COUNT"
            echo "======================================"
            echo "$URL"
            echo "======================================"


            # ==========================================
            # Temporary output file
            # ==========================================

            OUTPUT_FILE="yt_output_${COUNT}.txt"

            rm -f "$OUTPUT_FILE"


            # ==========================================
            # Download
            # ==========================================

            echo ""
            echo "Downloading..."

            set +e

            timeout 30m yt-dlp \
              --cookies cookies.txt \
              --remote-components ejs:github \
              --socket-timeout 30 \
              --retries 10 \
              --fragment-retries 10 \
              --retry-sleep 5 \
              -f "best[height<=720]/best" \
              --merge-output-format mp4 \
              -o "downloads/%(title)s.%(ext)s" \
              --print after_move:filepath \
              "$URL" > "$OUTPUT_FILE" 2>&1

            EXIT_CODE=$?

            set -e


            # ==========================================
            # Show yt-dlp output
            # ==========================================

            cat "$OUTPUT_FILE"


            # ==========================================
            # Check download result
            # ==========================================

            if [ "$EXIT_CODE" -ne 0 ]; then

              echo ""
              echo "======================================"
              echo "DOWNLOAD FAILED"
              echo "======================================"

              echo "URL:"
              echo "$URL"

              echo "Exit code:"
              echo "$EXIT_CODE"

              echo "======================================"

              FAILED=$((FAILED + 1))

              rm -f "$OUTPUT_FILE"

              continue

            fi


            # ==========================================
            # Find downloaded file
            # ==========================================

            FILE_PATH=""

            # First try the path printed by yt-dlp
            PRINTED_PATH=$(grep -E '^downloads/' "$OUTPUT_FILE" | tail -n 1 || true)

            if [ -n "$PRINTED_PATH" ] && [ -f "$PRINTED_PATH" ]; then
              FILE_PATH="$PRINTED_PATH"
            fi


            # Fallback: find newest video file
            if [ -z "$FILE_PATH" ]; then

              FILE_PATH=$(
                find downloads \
                  -maxdepth 1 \
                  -type f \
                  \( \
                    -iname "*.mp4" \
                    -o -iname "*.mkv" \
                    -o -iname "*.webm" \
                    -o -iname "*.mov" \
                    -o -iname "*.avi" \
                  \) \
                  -printf '%T@ %p\n' \
                  | sort -nr \
                  | head -n 1 \
                  | cut -d' ' -f2-
              )

            fi


            # ==========================================
            # Verify file
            # ==========================================

            if [ -z "$FILE_PATH" ] || [ ! -f "$FILE_PATH" ]; then

              echo ""
              echo "ERROR:"
              echo "Downloaded file was not found."

              FAILED=$((FAILED + 1))

              rm -f "$OUTPUT_FILE"

              continue

            fi


            echo ""
            echo "======================================"
            echo "DOWNLOAD SUCCESS"
            echo "======================================"

            echo "Downloaded file:"
            echo "$FILE_PATH"


            # ==========================================
            # File information
            # ==========================================

            FILE_NAME=$(basename "$FILE_PATH")
            FILE_SIZE=$(du -h "$FILE_PATH" | cut -f1)

            echo ""
            echo "File name:"
            echo "$FILE_NAME"

            echo "File size:"
            echo "$FILE_SIZE"


            # ==========================================
            # Upload
            # ==========================================

            echo ""
            echo "Uploading to Google Drive..."


            export FILE_PATH


            python3 <<'PY'

          import json
          import os

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from google.oauth2 import service_account

          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          # ==========================================
          # File
          # ==========================================

          file_path = os.environ["FILE_PATH"]
          file_name = os.path.basename(file_path)


          print("======================================")
          print("Google Drive upload")
          print("======================================")

          print(f"File: {file_name}")
          print(f"Path: {file_path}")


          # ==========================================
          # Token
          # ==========================================

          with open(
              "token.json",
              "r",
              encoding="utf-8"
          ) as f:

              token_info = json.load(f)


          scopes = [
              "https://www.googleapis.com/auth/drive"
          ]


          # ==========================================
          # Authentication
          # ==========================================

          if token_info.get("type") == "service_account":

              print(
                  "Authentication type: Service Account"
              )

              creds = (
                  service_account
                  .Credentials
                  .from_service_account_info(
                      token_info,
                      scopes=scopes
                  )
              )

          else:

              print(
                  "Authentication type: OAuth"
              )

              creds = (
                  Credentials
                  .from_authorized_user_info(
                      token_info,
                      scopes=scopes
                  )
              )

              if creds.expired and creds.refresh_token:

                  print(
                      "Refreshing OAuth token..."
                  )

                  creds.refresh(
                      Request()
                  )


          # ==========================================
          # Drive API
          # ==========================================

          service = build(
              "drive",
              "v3",
              credentials=creds
          )


          # ==========================================
          # Upload
          # ==========================================

          media = MediaFileUpload(
              file_path,
              mimetype="video/mp4",
              resumable=True
          )


          uploaded = (
              service.files()
              .create(
                  body={
                      "name": file_name
                  },
                  media_body=media,
                  fields="id,name,webViewLink"
              )
              .execute()
          )


          # ==========================================
          # Result
          # ==========================================

          print("")
          print("======================================")
          print("UPLOAD SUCCESS")
          print("======================================")

          print(
              json.dumps(
                  uploaded,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print("======================================")


          PY


            # ==========================================
            # Delete local video
            # ==========================================

            echo ""
            echo "Deleting local file..."

            rm -f "$FILE_PATH"

            echo "Local file deleted."


            # ==========================================
            # Cleanup
            # ==========================================

            rm -f "$OUTPUT_FILE"


            SUCCESS=$((SUCCESS + 1))


            echo ""
            echo "======================================"
            echo "VIDEO COMPLETED"
            echo "======================================"

          done <<< "$URLS"


          # ==========================================
          # Summary
          # ==========================================

          echo ""
          echo ""
          echo "======================================"
          echo "FINAL SUMMARY"
          echo "======================================"

          echo "Total URLs: $COUNT"
          echo "Successful: $SUCCESS"
          echo "Failed: $FAILED"

          echo "======================================"


          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No URLs were provided."
            exit 1
          fi


          if [ "$SUCCESS" -eq 0 ]; then
            echo "All downloads failed."
            exit 1
          fi

      # ==========================================
      # Cleanup secrets
      # ==========================================

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning temporary credentials..."

          rm -f token.json

          echo "Cleanup completed."