name: Linux Proxy VPS

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ==========================================
      # Install Squid
      # ==========================================
      - name: Install Squid
        run: |
          sudo apt update

          sudo apt install -y \
            squid \
            curl

          squid --version

      # ==========================================
      # Configure Squid
      # ==========================================
      - name: Configure Squid
        run: |
          sudo cp /etc/squid/squid.conf /etc/squid/squid.conf.backup

          sudo tee /etc/squid/squid.conf > /dev/null <<'EOF'
          http_port 3128

          acl all src all
          http_access allow all

          cache deny all

          access_log none
          cache_log /var/log/squid/cache.log

          forwarded_for delete
          via off

          request_header_access X-Forwarded-For deny all
          request_header_access Via deny all
          request_header_access Cache-Control deny all
          EOF

          sudo squid -k parse

          sudo systemctl restart squid

          sudo systemctl enable squid

      # ==========================================
      # Test Proxy
      # ==========================================
      - name: Test Proxy
        run: |
          echo "Testing Squid..."

          curl \
            --proxy http://127.0.0.1:3128 \
            --max-time 20 \
            -I \
            https://example.com

          echo ""
          echo "Squid is working."

      # ==========================================
      # Install Cloudflared
      # ==========================================
      - name: Install Cloudflared
        run: |
          curl -L \
            --fail \
            -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      # ==========================================
      # Start Cloudflare Tunnel
      # ==========================================
      - name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo ""
            echo "ERROR:"
            echo "CLOUDFLARE_TUNNEL_TOKEN is missing."
            echo ""
            exit 1
          fi

          echo "Starting Cloudflare Tunnel..."

          nohup cloudflared tunnel run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN" \
            > tunnel.log 2>&1 &

          echo $! > tunnel.pid

          sleep 10

          echo ""
          echo "=========================================="
          echo "Cloudflare Tunnel"
          echo "=========================================="

          cat tunnel.log

          if ! kill -0 "$(cat tunnel.pid)" 2>/dev/null; then
            echo ""
            echo "Cloudflare Tunnel failed."
            exit 1
          fi

          echo ""
          echo "Tunnel is running."

      # ==========================================
      # Show Proxy Information
      # ==========================================
      - name: Show Proxy Information
        run: |
          echo ""
          echo "=============================================="
          echo "             PROXY VPS READY"
          echo "=============================================="
          echo ""
          echo "Squid:"
          echo "    127.0.0.1:3128"
          echo ""
          echo "Cloudflare:"
          echo "    Tunnel is connected"
          echo ""
          echo "On Windows run cloudflared access tcp"
          echo "to create a local connection."
          echo ""
          echo "Then configure Windows:"
          echo ""
          echo "    Address: 127.0.0.1"
          echo "    Port:    3128"
          echo ""
          echo "=============================================="

      # ==========================================
      # Keep Alive
      # ==========================================
      - name: Keep Alive
        run: |
          echo ""
          echo "Proxy VPS is running."
          echo ""

          while true
          do
            sleep 60

            if ! sudo systemctl is-active --quiet squid
            then
              echo "Squid stopped - restarting..."
              sudo systemctl restart squid
            fi

            if ! kill -0 "$(cat tunnel.pid)" 2>/dev/null
            then
              echo "Cloudflare Tunnel stopped."
              cat tunnel.log || true
              exit 1
            fi

            echo "[$(date)] VPS alive"
          done