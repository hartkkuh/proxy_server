name: GitHub Actions Proxy

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ==========================================================
      # Install packages
      # ==========================================================
      - name: Install packages
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            squid \
            curl \
            python3 \
            python3-pip

          python3 -m pip install \
            --break-system-packages \
            websockify

      # ==========================================================
      # Configure Squid
      # ==========================================================
      - name: Configure Squid
        run: |
          set -e

          sudo tee /etc/squid/squid.conf > /dev/null <<'EOF'
          http_port 127.0.0.1:3128

          acl localhost src 127.0.0.1/32

          http_access allow localhost
          http_access deny all

          cache deny all

          access_log none

          forwarded_for delete
          via off

          request_header_access X-Forwarded-For deny all
          request_header_access Via deny all
          EOF

          echo "Checking Squid configuration..."

          sudo squid -k parse

          echo "Starting Squid..."

          sudo systemctl restart squid

          sleep 2

          if ! sudo systemctl is-active --quiet squid; then
            echo "Squid failed to start."
            sudo journalctl -u squid --no-pager -n 100
            exit 1
          fi

          echo "Squid is running."

      # ==========================================================
      # Test Squid
      # ==========================================================
      - name: Test Squid
        run: |
          set -e

          echo "Testing Squid..."

          curl \
            --proxy http://127.0.0.1:3128 \
            --max-time 20 \
            -I \
            https://example.com

          echo ""
          echo "Squid test successful."

      # ==========================================================
      # Start WebSocket -> TCP bridge
      # ==========================================================
      - name: Start WebSocket bridge
        run: |
          set -e

          rm -f websockify.log
          rm -f websockify.pid

          echo "Starting websockify..."

          nohup websockify \
            0.0.0.0:8080 \
            127.0.0.1:3128 \
            > websockify.log 2>&1 &

          WEBSOCKIFY_PID=$!

          echo "$WEBSOCKIFY_PID" > websockify.pid

          sleep 3

          if ! kill -0 "$WEBSOCKIFY_PID" 2>/dev/null; then
            echo ""
            echo "=========================================="
            echo "websockify failed"
            echo "=========================================="
            echo ""

            cat websockify.log

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "WebSocket bridge is running"
          echo "=========================================="
          echo ""
          echo "Listen: 0.0.0.0:8080"
          echo "Target: 127.0.0.1:3128"
          echo ""

      # ==========================================================
      # Install Cloudflared
      # ==========================================================
      - name: Install Cloudflared
        run: |
          set -e

          curl \
            -L \
            --fail \
            --silent \
            --show-error \
            -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      # ==========================================================
      # Start Cloudflare Quick Tunnel
      # ==========================================================
      - name: Start Cloudflare Quick Tunnel
        run: |
          set -e

          rm -f tunnel.log
          rm -f tunnel.pid

          echo "Starting Cloudflare Quick Tunnel..."

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8080 \
            --no-autoupdate \
            > tunnel.log 2>&1 &

          TUNNEL_PID=$!

          echo "$TUNNEL_PID" > tunnel.pid

          echo ""
          echo "Waiting for Cloudflare URL..."

          TUNNEL_URL=""

          for i in {1..60}; do

            TUNNEL_URL=$(
              grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                tunnel.log \
                | head -n 1 \
                || true
            )

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            echo "Waiting... $i/60"

            sleep 2

          done

          if [ -z "$TUNNEL_URL" ]; then

            echo ""
            echo "=========================================="
            echo "Cloudflare Quick Tunnel failed"
            echo "=========================================="
            echo ""

            cat tunnel.log

            exit 1
          fi

          WS_URL="${TUNNEL_URL/https:/wss:}"

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          echo "WS_URL=$WS_URL" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "       CLOUDFLARE QUICK TUNNEL READY"
          echo "=============================================="
          echo ""
          echo "HTTPS:"
          echo "$TUNNEL_URL"
          echo ""
          echo "WebSocket:"
          echo "$WS_URL"
          echo ""
          echo "=============================================="

      # ==========================================================
      # Verify processes
      # ==========================================================
      - name: Verify services
        run: |
          echo ""
          echo "=============================================="
          echo "SERVICE STATUS"
          echo "=============================================="
          echo ""

          echo "Squid:"
          sudo systemctl is-active squid || true

          echo ""
          echo "websockify:"
          if kill -0 "$(cat websockify.pid)" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "STOPPED"
            cat websockify.log || true
            exit 1
          fi

          echo ""
          echo "cloudflared:"
          if kill -0 "$(cat tunnel.pid)" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "STOPPED"
            cat tunnel.log || true
            exit 1
          fi

          echo ""
          echo "=============================================="

      # ==========================================================
      # Print information
      # ==========================================================
      - name: Print connection information
        run: |
          echo ""
          echo "================================================"
          echo "              PROXY VPS INFORMATION"
          echo "================================================"
          echo ""
          echo "Squid:"
          echo "127.0.0.1:3128"
          echo ""
          echo "WebSocket bridge:"
          echo "127.0.0.1:8080"
          echo ""
          echo "Cloudflare Quick Tunnel:"
          echo "$TUNNEL_URL"
          echo ""
          echo "WebSocket endpoint:"
          echo "$WS_URL"
          echo ""
          echo "================================================"
          echo ""
          echo "No Cloudflare token was required."
          echo "No Cloudflare Dashboard configuration was required."
          echo ""
          echo "================================================"

      # ==========================================================
      # Keep runner alive
      # ==========================================================
      - name: Keep Alive
        run: |
          echo ""
          echo "Proxy VPS is running."
          echo ""

          while true; do

            sleep 60

            # Check Squid
            if ! sudo systemctl is-active --quiet squid; then
              echo "Squid stopped."
              sudo systemctl restart squid
            fi

            # Check websockify
            if ! kill -0 "$(cat websockify.pid)" 2>/dev/null; then
              echo ""
              echo "websockify stopped."
              echo ""
              cat websockify.log || true
              exit 1
            fi

            # Check Cloudflare
            if ! kill -0 "$(cat tunnel.pid)" 2>/dev/null; then
              echo ""
              echo "Cloudflare tunnel stopped."
              echo ""
              cat tunnel.log || true
              exit 1
            fi

            echo "[$(date)] All services are running."

          done