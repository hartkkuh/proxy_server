name: GitHub Actions Pinggy Proxy

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ==========================================================
      # Install packages
      # ==========================================================
      - name: Install packages
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            squid \
            curl \
            openssh-client

      # ==========================================================
      # Configure Squid
      # ==========================================================
      - name: Configure Squid
        run: |
          set -e

          sudo tee /etc/squid/squid.conf > /dev/null <<'EOF'
          http_port 127.0.0.1:3128

          acl localhost src 127.0.0.1/32

          http_access allow localhost
          http_access deny all

          cache deny all

          access_log none

          forwarded_for delete
          via off

          request_header_access X-Forwarded-For deny all
          request_header_access Via deny all
          EOF

          echo "Checking Squid configuration..."

          sudo squid -k parse

          echo "Starting Squid..."

          sudo systemctl restart squid

          sleep 2

          if ! sudo systemctl is-active --quiet squid; then
            echo "Squid failed to start."

            sudo journalctl \
              -u squid \
              --no-pager \
              -n 100

            exit 1
          fi

          echo "Squid is running."

      # ==========================================================
      # Test Squid
      # ==========================================================
      - name: Test Squid
        run: |
          set -e

          echo "Testing Squid..."

          curl \
            --proxy http://127.0.0.1:3128 \
            --max-time 20 \
            -I \
            https://example.com

          echo ""
          echo "Squid test successful."

      # ==========================================================
      # Start Pinggy TCP Tunnel
      # ==========================================================
      - name: Start Pinggy TCP Tunnel
        run: |
          set -e

          rm -f pinggy.log
          rm -f pinggy.pid

          echo ""
          echo "=============================================="
          echo "Starting Pinggy TCP Tunnel"
          echo "=============================================="
          echo ""

          nohup ssh \
            -p 443 \
            -T \
            -N \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -R 0:127.0.0.1:3128 \
            tcp@free.pinggy.io \
            > pinggy.log 2>&1 &

          PINGGY_PID=$!

          echo "$PINGGY_PID" > pinggy.pid

          echo "Pinggy PID: $PINGGY_PID"

          echo ""
          echo "Waiting for Pinggy tunnel..."
          echo ""

          PINGGY_URL=""

          for i in {1..60}; do

            PINGGY_URL=$(
              grep -oE \
                'tcp://[^[:space:]]+' \
                pinggy.log \
                | head -n 1 \
                || true
            )

            if [ -n "$PINGGY_URL" ]; then
              break
            fi

            echo "Waiting... $i/60"

            sleep 2

          done

          echo ""
          echo "=============================================="
          echo "PINGGY OUTPUT"
          echo "=============================================="
          echo ""

          cat pinggy.log || true

          echo ""
          echo "=============================================="

          if [ -z "$PINGGY_URL" ]; then
            echo ""
            echo "ERROR: Pinggy TCP address was not detected."
            echo ""

            if ! kill -0 "$PINGGY_PID" 2>/dev/null; then
              echo "Pinggy process stopped."
            fi

            exit 1
          fi

          echo "$PINGGY_URL"

          echo ""

          # Extract host and port
          PINGGY_HOST=$(
            echo "$PINGGY_URL" \
              | sed -E 's#tcp://([^:]+):([0-9]+).*#\1#'
          )

          PINGGY_PORT=$(
            echo "$PINGGY_URL" \
              | sed -E 's#tcp://([^:]+):([0-9]+).*#\2#'
          )

          echo "PINGGY_URL=$PINGGY_URL" >> "$GITHUB_ENV"
          echo "PINGGY_HOST=$PINGGY_HOST" >> "$GITHUB_ENV"
          echo "PINGGY_PORT=$PINGGY_PORT" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "       PINGGY PROXY READY"
          echo "=============================================="
          echo ""
          echo "Public TCP address:"
          echo "$PINGGY_URL"
          echo ""
          echo "Host:"
          echo "$PINGGY_HOST"
          echo ""
          echo "Port:"
          echo "$PINGGY_PORT"
          echo ""
          echo "=============================================="

      # ==========================================================
      # Verify Pinggy
      # ==========================================================
      - name: Verify Pinggy
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "SERVICE STATUS"
          echo "=============================================="
          echo ""

          echo "Squid:"

          if sudo systemctl is-active --quiet squid; then
            echo "RUNNING"
          else
            echo "STOPPED"
            exit 1
          fi

          echo ""
          echo "Pinggy:"

          if kill -0 "$(cat pinggy.pid)" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "STOPPED"

            cat pinggy.log || true

            exit 1
          fi

          echo ""
          echo "=============================================="

      # ==========================================================
      # Print connection information
      # ==========================================================
      - name: Print connection information
        run: |
          echo ""
          echo "================================================"
          echo "             PINGGY PROXY INFORMATION"
          echo "================================================"
          echo ""
          echo "Public TCP:"
          echo "$PINGGY_URL"
          echo ""
          echo "Host:"
          echo "$PINGGY_HOST"
          echo ""
          echo "Port:"
          echo "$PINGGY_PORT"
          echo ""
          echo "Local Squid:"
          echo "127.0.0.1:3128"
          echo ""
          echo "================================================"
          echo ""
          echo "Configure your local Python bridge to connect"
          echo "to the Pinggy host and port above."
          echo ""
          echo "================================================"

      # ==========================================================
      # Keep runner alive
      # ==========================================================
      - name: Keep Alive
        run: |
          echo ""
          echo "Proxy VPS is running."
          echo ""

          while true; do

            sleep 60

            # ----------------------------------------------------
            # Check Squid
            # ----------------------------------------------------
            if ! sudo systemctl is-active --quiet squid; then

              echo ""
              echo "Squid stopped. Restarting..."

              sudo systemctl restart squid

              sleep 2

              if ! sudo systemctl is-active --quiet squid; then

                echo ""
                echo "Squid failed to restart."

                sudo journalctl \
                  -u squid \
                  --no-pager \
                  -n 100

                exit 1
              fi
            fi

            # ----------------------------------------------------
            # Check Pinggy
            # ----------------------------------------------------
            if ! kill -0 "$(cat pinggy.pid)" 2>/dev/null; then

              echo ""
              echo "Pinggy stopped."
              echo ""

              cat pinggy.log || true

              exit 1
            fi

            echo "[$(date)] Squid + Pinggy are running."

          done
          