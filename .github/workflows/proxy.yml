name: GitHub Actions Proxy VPS

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest

    # GitHub-hosted runner מוגבל בזמן.
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. Install Squid
      # ============================================================
      - name: Install Squid
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y squid curl

          squid --version

      # ============================================================
      # 2. Configure Squid
      # ============================================================
      - name: Configure Squid
        run: |
          set -e

          sudo tee /etc/squid/squid.conf > /dev/null <<'EOF'

          # HTTP proxy port
          http_port 3128

          # Allow connections
          acl all src all
          http_access allow all

          # Disable cache
          cache deny all

          # Reduce logging
          access_log none

          # Do not expose proxy forwarding information
          forwarded_for delete
          via off

          request_header_access X-Forwarded-For deny all
          request_header_access Via deny all

          EOF

          sudo squid -k parse

          sudo systemctl restart squid

          echo "Squid status:"
          sudo systemctl status squid --no-pager

      # ============================================================
      # 3. Test local proxy
      # ============================================================
      - name: Test Squid
        run: |
          set -e

          echo "Testing proxy..."

          curl \
            --proxy http://127.0.0.1:3128 \
            --max-time 20 \
            -I \
            https://example.com

          echo ""
          echo "Squid works."

      # ============================================================
      # 4. Install cloudflared
      # ============================================================
      - name: Install cloudflared
        run: |
          set -e

          curl -L \
            --fail \
            --silent \
            --show-error \
            -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      # ============================================================
      # 5. Check Cloudflare secret
      # ============================================================
      - name: Check Cloudflare Token
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo ""
            echo "=============================================="
            echo "ERROR: CLOUDFLARE_TUNNEL_TOKEN is missing."
            echo "=============================================="
            echo ""
            echo "Create this GitHub repository secret:"
            echo ""
            echo "CLOUDFLARE_TUNNEL_TOKEN"
            echo ""
            exit 1
          fi

          echo "Cloudflare token exists."

      # ============================================================
      # 6. Start Cloudflare Tunnel
      # ============================================================
      - name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -e

          echo "Starting Cloudflare Tunnel..."

          nohup cloudflared tunnel run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN" \
            > cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" > cloudflared.pid

          echo "cloudflared PID: $CLOUDFLARED_PID"

          sleep 10

          echo ""
          echo "Cloudflare log:"
          cat cloudflared.log || true

          if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
            echo ""
            echo "ERROR: cloudflared stopped."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "Cloudflare Tunnel is running."
          echo "=============================================="

      # ============================================================
      # 7. Display Windows instructions
      # ============================================================
      - name: Show Windows configuration
        run: |
          echo ""
          echo "======================================================"
          echo "             PROXY IS READY"
          echo "======================================================"
          echo ""
          echo "Cloudflare Tunnel is connected to:"
          echo ""
          echo "    127.0.0.1:3128"
          echo ""
          echo "    Windows must run:"
          echo ""
          echo "    cloudflared access tcp --hostname YOUR_HOSTNAME --url 127.0.0.1:3128"
          echo ""
          echo "Then configure Windows proxy:"
          echo ""
          echo "    Address: 127.0.0.1"
          echo "    Port:    3128"
          echo ""
          echo "======================================================"

      # ============================================================
      # 8. Keep runner alive
      # ============================================================
      - name: Keep Proxy Alive
        run: |
          echo ""
          echo "======================================================"
          echo "GitHub Actions Proxy VPS is running"
          echo "======================================================"
          echo ""

          while true; do

            sleep 60

            # Check Squid
            if ! sudo systemctl is-active --quiet squid; then
              echo "Squid stopped. Restarting..."
              sudo systemctl restart squid
            fi

            # Check cloudflared
            if [ ! -f cloudflared.pid ]; then
              echo "cloudflared PID file missing."
              exit 1
            fi

            CLOUDFLARED_PID=$(cat cloudflared.pid)

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo ""
              echo "cloudflared stopped."
              echo ""
              echo "Cloudflare log:"
              cat cloudflared.log || true
              exit 1
            fi

            echo "[$(date)] Proxy alive"

          done