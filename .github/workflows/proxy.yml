name: GitHub Actions Pinggy Proxy

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ==========================================================
      # Install packages
      # ==========================================================
      - name: Install packages
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            squid \
            curl \
            openssh-client \
            jq

      # ==========================================================
      # Configure Squid
      # ==========================================================
      - name: Configure Squid
        run: |
          set -e

          sudo tee /etc/squid/squid.conf > /dev/null <<'EOF'
          http_port 127.0.0.1:3128

          acl localhost src 127.0.0.1/32

          http_access allow localhost
          http_access deny all

          cache deny all

          access_log none

          forwarded_for delete
          via off

          request_header_access X-Forwarded-For deny all
          request_header_access Via deny all
          EOF

          echo "Checking Squid configuration..."

          sudo squid -k parse

          echo "Starting Squid..."

          sudo systemctl restart squid

          sleep 2

          if ! sudo systemctl is-active --quiet squid; then
            echo "Squid failed to start."

            sudo journalctl \
              -u squid \
              --no-pager \
              -n 100

            exit 1
          fi

          echo "Squid is running."

      # ==========================================================
      # Test Squid
      # ==========================================================
      - name: Test Squid
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "Testing Squid"
          echo "=============================================="
          echo ""

          curl \
            --proxy http://127.0.0.1:3128 \
            --max-time 20 \
            -I \
            https://example.com

          echo ""
          echo "Squid test successful."

      # ==========================================================
      # Start Pinggy
      #
      # 127.0.0.1:3128 = Squid
      #
      # 127.0.0.1:4300 = Pinggy Web Debugger API
      #
      # Public TCP address is retrieved from:
      #
      # http://127.0.0.1:4300/urls
      # ==========================================================
      - name: Start Pinggy TCP Tunnel
        run: |
          set -e

          rm -f pinggy.log
          rm -f pinggy.pid

          echo ""
          echo "=============================================="
          echo "Starting Pinggy TCP Tunnel"
          echo "=============================================="
          echo ""

          nohup ssh \
            -p 443 \
            -T \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -R 0:127.0.0.1:3128 \
            -L 4300:127.0.0.1:4300 \
            tcp@free.pinggy.io \
            > pinggy.log 2>&1 &

          PINGGY_PID=$!

          echo "$PINGGY_PID" > pinggy.pid

          echo "Pinggy PID: $PINGGY_PID"

          echo ""
          echo "Waiting for Pinggy..."
          echo ""

          PINGGY_URL=""

          for i in {1..60}; do

            if ! kill -0 "$PINGGY_PID" 2>/dev/null; then

              echo ""
              echo "Pinggy process stopped unexpectedly."
              echo ""

              cat pinggy.log || true

              exit 1
            fi

            # ----------------------------------------------------
            # Ask Pinggy Web Debugger API for tunnel addresses
            # ----------------------------------------------------

            URLS_JSON=$(
              curl \
                --silent \
                --show-error \
                --max-time 5 \
                http://127.0.0.1:4300/urls \
                2>/dev/null \
                || true
            )

            if [ -n "$URLS_JSON" ]; then

              echo ""
              echo "Pinggy API response:"
              echo "$URLS_JSON"
              echo ""

              PINGGY_URL=$(
                echo "$URLS_JSON" \
                  | jq -r '
                      .urls[]
                      | select(startswith("tcp://"))
                    ' \
                  | head -n 1 \
                  || true
              )

            fi

            if [ -n "$PINGGY_URL" ]; then
              break
            fi

            echo "Waiting... $i/60"

            sleep 2

          done

          echo ""
          echo "=============================================="
          echo "PINGGY SSH OUTPUT"
          echo "=============================================="
          echo ""

          cat pinggy.log || true

          echo ""
          echo "=============================================="

          # ======================================================
          # Check result
          # ======================================================

          if [ -z "$PINGGY_URL" ]; then

            echo ""
            echo "=============================================="
            echo "ERROR: Pinggy TCP address was not detected."
            echo "=============================================="
            echo ""

            echo "Debugger API:"
            curl \
              --silent \
              --show-error \
              http://127.0.0.1:4300/urls \
              || true

            echo ""
            echo "SSH log:"
            cat pinggy.log || true

            echo ""

            exit 1
          fi

          # ======================================================
          # Extract host and port
          # ======================================================

          PINGGY_HOST=$(
            echo "$PINGGY_URL" \
              | sed -E \
                's#tcp://([^:/]+):([0-9]+).*#\1#'
          )

          PINGGY_PORT=$(
            echo "$PINGGY_URL" \
              | sed -E \
                's#tcp://([^:/]+):([0-9]+).*#\2#'
          )

          # ======================================================
          # Validate
          # ======================================================

          if [ -z "$PINGGY_HOST" ]; then
            echo "ERROR: Could not extract Pinggy host."
            exit 1
          fi

          if [ -z "$PINGGY_PORT" ]; then
            echo "ERROR: Could not extract Pinggy port."
            exit 1
          fi

          # ======================================================
          # Save GitHub environment
          # ======================================================

          echo "PINGGY_URL=$PINGGY_URL" >> "$GITHUB_ENV"
          echo "PINGGY_HOST=$PINGGY_HOST" >> "$GITHUB_ENV"
          echo "PINGGY_PORT=$PINGGY_PORT" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "           PINGGY PROXY READY"
          echo "=============================================="
          echo ""

          echo "Public TCP:"
          echo "$PINGGY_URL"

          echo ""
          echo "Host:"
          echo "$PINGGY_HOST"

          echo ""
          echo "Port:"
          echo "$PINGGY_PORT"

          echo ""
          echo "=============================================="

      # ==========================================================
      # Verify services
      # ==========================================================
      - name: Verify services
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "SERVICE STATUS"
          echo "=============================================="
          echo ""

          # ------------------------------------------------------
          # Squid
          # ------------------------------------------------------

          echo "Squid:"

          if sudo systemctl is-active --quiet squid; then
            echo "RUNNING"
          else
            echo "STOPPED"

            sudo journalctl \
              -u squid \
              --no-pager \
              -n 100

            exit 1
          fi

          # ------------------------------------------------------
          # Pinggy
          # ------------------------------------------------------

          echo ""
          echo "Pinggy:"

          if kill -0 "$(cat pinggy.pid)" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "STOPPED"

            cat pinggy.log || true

            exit 1
          fi

          # ------------------------------------------------------
          # Pinggy API
          # ------------------------------------------------------

          echo ""
          echo "Pinggy API:"

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:4300/urls

          echo ""
          echo ""
          echo "=============================================="

      # ==========================================================
      # Print connection information
      # ==========================================================
      - name: Print connection information
        run: |
          echo ""
          echo "================================================"
          echo "             PINGGY PROXY INFORMATION"
          echo "================================================"
          echo ""

          echo "Public TCP address:"
          echo "$PINGGY_URL"

          echo ""
          echo "Pinggy Host:"
          echo "$PINGGY_HOST"

          echo ""
          echo "Pinggy Port:"
          echo "$PINGGY_PORT"

          echo ""
          echo "Local Squid:"
          echo "127.0.0.1:3128"

          echo ""
          echo "================================================"
          echo ""
          echo "Put the following values into cloudflare_proxy.py:"
          echo ""
          echo "PINGGY_HOST = \"$PINGGY_HOST\""
          echo "PINGGY_PORT = $PINGGY_PORT"
          echo ""
          echo "================================================"

      # ==========================================================
      # Keep Alive
      # ==========================================================
      - name: Keep Alive
        run: |
          echo ""
          echo "=============================================="
          echo "Proxy VPS is running."
          echo "=============================================="
          echo ""

          while true; do

            sleep 60

            # ----------------------------------------------------
            # Check Squid
            # ----------------------------------------------------

            if ! sudo systemctl is-active --quiet squid; then

              echo ""
              echo "Squid stopped."
              echo "Restarting Squid..."
              echo ""

              sudo systemctl restart squid

              sleep 2

              if ! sudo systemctl is-active --quiet squid; then

                echo ""
                echo "Squid failed to restart."
                echo ""

                sudo journalctl \
                  -u squid \
                  --no-pager \
                  -n 100

                exit 1
              fi

            fi

            # ----------------------------------------------------
            # Check Pinggy
            # ----------------------------------------------------

            if ! kill -0 "$(cat pinggy.pid)" 2>/dev/null; then

              echo ""
              echo "Pinggy stopped."
              echo ""

              cat pinggy.log || true

              exit 1
            fi

            # ----------------------------------------------------
            # Check Pinggy API
            # ----------------------------------------------------

            CURRENT_URLS=$(
              curl \
                --silent \
                --max-time 5 \
                http://127.0.0.1:4300/urls \
                2>/dev/null \
                || true
            )

            if [ -z "$CURRENT_URLS" ]; then

              echo ""
              echo "WARNING: Pinggy API is not responding."
              echo ""

            else

              CURRENT_TCP=$(
                echo "$CURRENT_URLS" \
                  | jq -r '
                      .urls[]
                      | select(startswith("tcp://"))
                    ' \
                  | head -n 1 \
                  || true
              )

              if [ -z "$CURRENT_TCP" ]; then

                echo ""
                echo "WARNING: TCP tunnel is no longer visible."
                echo ""

                echo "$CURRENT_URLS"

              else

                echo "[$(date)]"
                echo "Squid: RUNNING"
                echo "Pinggy: RUNNING"
                echo "TCP: $CURRENT_TCP"

              fi

            fi

          done