name: GitHub Actions Proxy - ngrok

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ==========================================================
      # Install packages
      # ==========================================================
      - name: Install packages
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            squid \
            curl \
            python3 \
            python3-pip

          python3 -m pip install \
            --break-system-packages \
            websockify


      # ==========================================================
      # Configure Squid
      # ==========================================================
      - name: Configure Squid
        run: |
          set -e

          sudo tee /etc/squid/squid.conf > /dev/null <<'EOF'
          http_port 127.0.0.1:3128

          acl localhost src 127.0.0.1/32

          http_access allow localhost
          http_access deny all

          cache deny all

          access_log none

          forwarded_for delete
          via off

          request_header_access X-Forwarded-For deny all
          request_header_access Via deny all
          EOF

          echo "Checking Squid configuration..."

          sudo squid -k parse

          echo "Starting Squid..."

          sudo systemctl restart squid

          sleep 2

          if ! sudo systemctl is-active --quiet squid; then
            echo "Squid failed to start."
            sudo journalctl -u squid --no-pager -n 100
            exit 1
          fi

          echo "Squid is running."


      # ==========================================================
      # Test Squid
      # ==========================================================
      - name: Test Squid
        run: |
          set -e

          echo "Testing Squid..."

          curl \
            --proxy http://127.0.0.1:3128 \
            --max-time 20 \
            -I \
            https://example.com

          echo ""
          echo "Squid test successful."


      # ==========================================================
      # Start WebSocket -> TCP bridge
      # ==========================================================
      - name: Start WebSocket bridge
        run: |
          set -e

          rm -f websockify.log
          rm -f websockify.pid

          echo "Starting websockify..."

          nohup websockify \
            0.0.0.0:8080 \
            127.0.0.1:3128 \
            > websockify.log 2>&1 &

          WEBSOCKIFY_PID=$!

          echo "$WEBSOCKIFY_PID" > websockify.pid

          sleep 3

          if ! kill -0 "$WEBSOCKIFY_PID" 2>/dev/null; then
            echo ""
            echo "=========================================="
            echo "websockify failed"
            echo "=========================================="
            echo ""

            cat websockify.log

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "WebSocket bridge is running"
          echo "=========================================="
          echo ""
          echo "Listen: 0.0.0.0:8080"
          echo "Target: 127.0.0.1:3128"
          echo ""


      # ==========================================================
      # Install ngrok
      # ==========================================================
      - name: Install ngrok
        run: |
          set -e

          echo "Installing ngrok..."

          curl \
            -L \
            --fail \
            --silent \
            --show-error \
            https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
            -o ngrok.tgz

          tar -xzf ngrok.tgz

          sudo mv ngrok /usr/local/bin/ngrok

          ngrok version


      # ==========================================================
      # Configure ngrok
      # ==========================================================
      - name: Configure ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          set -e

          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ERROR: NGROK_AUTHTOKEN secret is missing."
            exit 1
          fi

          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          echo "ngrok configured."


      # ==========================================================
      # Start ngrok
      # ==========================================================
      - name: Start ngrok tunnel
        run: |
          set -e

          rm -f ngrok.log
          rm -f ngrok.pid

          echo "Starting ngrok..."

          nohup ngrok http \
            8080 \
            --log=stdout \
            > ngrok.log 2>&1 &

          NGROK_PID=$!

          echo "$NGROK_PID" > ngrok.pid

          echo ""
          echo "Waiting for ngrok URL..."

          NGROK_URL=""

          for i in {1..60}; do

            NGROK_URL=$(
              curl \
                --silent \
                --max-time 5 \
                http://127.0.0.1:4040/api/tunnels \
                2>/dev/null \
                | python3 -c '
          import sys
          import json

          try:
              data = json.load(sys.stdin)

              for tunnel in data.get("tunnels", []):
                  url = tunnel.get("public_url", "")

                  if url.startswith("https://"):
                      print(url)
                      break

          except Exception:
              pass
          ' \
                || true
            )

            if [ -n "$NGROK_URL" ]; then
              break
            fi

            echo "Waiting... $i/60"

            sleep 2

          done


          if [ -z "$NGROK_URL" ]; then

            echo ""
            echo "=========================================="
            echo "ngrok failed"
            echo "=========================================="
            echo ""

            cat ngrok.log

            exit 1
          fi


          # Convert HTTPS URL to WSS URL
          WS_URL="${NGROK_URL/https:/wss:}"


          echo "NGROK_URL=$NGROK_URL" >> "$GITHUB_ENV"
          echo "WS_URL=$WS_URL" >> "$GITHUB_ENV"


          echo ""
          echo "=============================================="
          echo "             NGROK TUNNEL READY"
          echo "=============================================="
          echo ""
          echo "HTTPS:"
          echo "$NGROK_URL"
          echo ""
          echo "WebSocket:"
          echo "$WS_URL"
          echo ""
          echo "=============================================="


      # ==========================================================
      # Verify services
      # ==========================================================
      - name: Verify services
        run: |
          echo ""
          echo "=============================================="
          echo "SERVICE STATUS"
          echo "=============================================="
          echo ""

          echo "Squid:"
          sudo systemctl is-active squid || true

          echo ""
          echo "websockify:"

          if kill -0 "$(cat websockify.pid)" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "STOPPED"
            cat websockify.log || true
            exit 1
          fi

          echo ""
          echo "ngrok:"

          if kill -0 "$(cat ngrok.pid)" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "STOPPED"
            cat ngrok.log || true
            exit 1
          fi

          echo ""
          echo "=============================================="


      # ==========================================================
      # Print connection information
      # ==========================================================
      - name: Print connection information
        run: |
          echo ""
          echo "================================================"
          echo "              PROXY INFORMATION"
          echo "================================================"
          echo ""

          echo "Local Squid:"
          echo "127.0.0.1:3128"

          echo ""

          echo "WebSocket bridge:"
          echo "127.0.0.1:8080"

          echo ""

          echo "ngrok:"
          echo "$NGROK_URL"

          echo ""

          echo "WebSocket:"
          echo "$WS_URL"

          echo ""

          echo "================================================"
          echo ""
          echo "Copy WS_URL into the Python client."
          echo ""
          echo "================================================"


      # ==========================================================
      # Keep runner alive
      # ==========================================================
      - name: Keep Alive
        run: |
          echo ""
          echo "Proxy VPS is running."
          echo ""

          while true; do

            sleep 60


            # ----------------------------------------------------
            # Check Squid
            # ----------------------------------------------------

            if ! sudo systemctl is-active --quiet squid; then

              echo "Squid stopped."
              echo "Restarting Squid..."

              sudo systemctl restart squid

              sleep 2

            fi


            # ----------------------------------------------------
            # Check websockify
            # ----------------------------------------------------

            if ! kill -0 "$(cat websockify.pid)" 2>/dev/null; then

              echo ""
              echo "websockify stopped."
              echo ""

              cat websockify.log || true

              exit 1

            fi


            # ----------------------------------------------------
            # Check ngrok
            # ----------------------------------------------------

            if ! kill -0 "$(cat ngrok.pid)" 2>/dev/null; then

              echo ""
              echo "ngrok stopped."
              echo ""

              cat ngrok.log || true

              exit 1

            fi


            echo "[$(date)] All services are running."

          done